<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phin-tech docs</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; --link: #0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #161618; --muted: #a1a1a6; --line: #38383a; --link: #8ab4f8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); padding: 1rem 0; }
  a { color: var(--link); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  li span { display: block; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>phin-tech docs</h1>
  <p>Documentation for projects.</p>
  <ul>
    <li><a href="/starci/">starci</a><span>CI defined as a script instead of YAML.</span></li>
  </ul>
</main>
</body>
</html>
